worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Basic rate limiting — a real deployment should tune this per expected
    # traffic; these are conservative POC defaults to prevent accidental
    # self-inflicted overload during testing.
    limit_req_zone $binary_remote_addr zone=rag_limit:10m rate=10r/s;

    upstream rag_api_backend {
        server rag-api:8000;
    }

    server {
        listen 80;
        server_name _;

        # Increase timeouts — LLM inference can legitimately take 10-30+
        # seconds on CPU-only hardware; default nginx timeouts will cut
        # this off prematurely.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        client_max_body_size 20M;  # allow reasonably large document uploads for /ingest

        location / {
            limit_req zone=rag_limit burst=20 nodelay;
            proxy_pass http://rag_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            # No rate limit on health checks — monitoring systems need
            # unrestricted access
            proxy_pass http://rag_api_backend/health;
        }
    }
}
