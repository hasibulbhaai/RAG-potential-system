global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "rag-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-api:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Uncomment if you add node_exporter for VM-level host metrics (CPU/RAM/disk)
  # - job_name: "node"
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
